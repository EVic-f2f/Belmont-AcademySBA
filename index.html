<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Belmout Academy</title>
  <style>
    :root {
      --bg: #0b1220;
      --surface: #111827;
      --surface-soft: #1e293b;
      --text: #e2e8f0;
      --accent: #60a5fa;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(96, 165, 250, 0.16), transparent 22%),
                  linear-gradient(180deg, #111827 0%, #0b1220 100%);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(760px, 100%);
      background: rgba(15, 23, 42, 0.98);
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
      padding: 36px;
      border: 1px solid rgba(96, 165, 250, 0.14);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.8rem, 3vw, 2.5rem);
      color: var(--accent);
    }

    p {
      line-height: 1.75;
      margin: 10px 0;
      color: #cbd5e1;
    }

    .highlights {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-top: 20px;
    }

    .item {
      background: rgba(96, 165, 250, 0.08);
      border: 1px solid rgba(96, 165, 250, 0.16);
      border-radius: 14px;
      padding: 14px;
    }

    .item strong {
      display: block;
      margin-bottom: 4px;
      color: #bfdbfe;
    }

    a {
      display: inline-block;
      background: var(--accent);
      color: white;
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 600;
      box-shadow: 0 16px 36px rgba(96, 165, 250, 0.25);
      transition: transform 0.2s ease;
    }

    a:hover {
      transform: translateY(-1px);
    }

    footer {
      margin-top: 22px;
      font-size: 0.92rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Welcome to Belmout Academy</h1>
    <p>
      Belmout Academy is the first ever center of exelence opening its doors in 2009
    </p>
    <p>
      Through modern classrooms, supportive mentors, and hands-on learning, we prepare
      learners for success in academics and beyond.
    </p>

    <div style="margin-top: 24px;">
      <a href="home.html" style="display: inline-block; background: #2563eb; color: white; text-decoration: none; padding: 12px 18px; border-radius: 10px; font-weight: 600;">Continue</a>
    </div>

    <footer>
      Belmout Academy · Commited to Exelence.
    </footer>
  </main>
</body>
</html>
